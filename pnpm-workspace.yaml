allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

# Parches de seguridad en dependencias transitivas (versión mínima corregida).
# postcss/nanoid/source-map-js llegan fijadas por next; effect y deepmerge-ts
# por @prisma/config (solo CLI de Prisma); sharp evita que next arrastre 0.34.
overrides:
  'postcss@<8.5.23': 8.5.23
  'nanoid@<3.3.18': 3.3.18
  'source-map-js@<1.2.2': 1.2.2
  'effect@<3.22.1': 3.22.1
  'deepmerge-ts@<8.0.0': 8.0.0
  'sharp@<0.35.5': 0.35.5
